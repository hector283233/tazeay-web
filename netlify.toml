[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# React Router: every address (/ru/departments/fish …) loads index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# temporary site: keep it out of Google until the real launch
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"